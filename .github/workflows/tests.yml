name: Tests

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Run tests
        run: python -m unittest discover -v

      - name: Compile source files
        run: python -m compileall date_utils.py database.py server.py mobile_cookie_security.py mobile_http_hardening.py db_lifecycle_hardening.py admin_security.py ui_security.py ui_design.py ui_shell.py ui_dashboard.py ui_catalog.py ui_transactions.py ui_stock_history.py ui_alerts_reports.py ui_support_final.py xnt_excel_export.py ui.py ui_dispatch.py ui_purchase.py ui_temp_log.py quanly_xnt.py ui_smoke_check.py test_fixes.py test_migration_hardening.py test_admin_security.py test_mobile_cookie_security.py test_mobile_http_hardening.py test_db_lifecycle_hardening.py test_ui_foundation.py test_ui_dashboard.py test_ui_catalog.py test_ui_transactions.py test_ui_stock_history.py test_ui_alerts_reports.py test_ui_support_final.py test_xnt_excel_export.py

      - name: Desktop UI smoke
        run: python ui_smoke_check.py
