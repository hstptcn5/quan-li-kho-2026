name: Tests

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Run tests
        run: python -m unittest discover -v

      - name: Compile source files
        run: python -m compileall date_utils.py database.py server.py admin_security.py ui_security.py ui.py ui_dispatch.py ui_purchase.py ui_temp_log.py quanly_xnt.py test_fixes.py test_migration_hardening.py test_admin_security.py
